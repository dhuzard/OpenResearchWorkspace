layout_version: "0.1"

roots:
  data:
    role: scientific_data
    human_label: Data
    semantics: "Scientific inputs and derived data products."
    children:
      raw:
        role: authoritative_source_data
        mutability: read_only_by_default
        may_be_external: true
      processed:
        role: derived_data
        mutability: regenerable
      external:
        role: external_data_references
        mutability: editable_metadata

  analysis:
    role: computational_methods
    human_label: Analysis
    semantics: "Code, notebooks, and workflows that transform data into results."
    children:
      notebooks:
        role: exploratory_analysis
      scripts:
        role: reusable_analysis_code
      workflows:
        role: reproducible_pipeline_definitions

  results:
    role: derived_scientific_outputs
    human_label: Results
    semantics: "Outputs generated by analyses; not authoritative source evidence."
    children:
      tables:
        role: result_tables
      figures:
        role: figures
      reports:
        role: generated_reports

  protocols:
    role: scientific_methods
    human_label: Protocols
    semantics: "Experimental, acquisition, preprocessing, or procedural methods."

  references:
    role: scholarly_context
    human_label: References
    semantics: "Literature, citation exports, and external scientific resources."

  project-docs:
    role: human_project_context
    human_label: Project notes
    semantics: "Decisions, notes, rationale, data-management notes, and project history."

infrastructure:
  .research:
    role: machine_readable_workspace_context
    scientist_facing: false
  .github:
    role: github_automation_and_forms
    scientist_facing: false

provenance_flow:
  - data/raw
  - data/processed
  - analysis
  - results
  - publication_or_archive
