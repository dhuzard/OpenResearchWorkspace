name: Add a measurement / Assay
description: Add a distinct measurement type to an existing Study.
title: "[ORW Add Assay] "
body:
  - type: markdown
    attributes:
      value: |
        # Add a measurement / Assay

        Use this when one Study contains a distinct measurement or test that benefits from its own data, analysis, results, and provenance.

        Examples: behaviour, ECG, imaging, electrophysiology, RNA-seq.

  - type: input
    id: study
    attributes:
      label: Which Study?
      description: Enter the Study title or its folder/identifier as shown in the project README.
      placeholder: Light exposure study
    validations:
      required: true

  - type: input
    id: assay_title
    attributes:
      label: Measurement / Assay name
      placeholder: ECG
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Short description (optional)

  - type: checkboxes
    id: confirmation
    attributes:
      label: Ready to add this measurement
      options:
        - label: This measurement belongs to the Study named above.
          required: true
