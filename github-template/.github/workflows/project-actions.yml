name: ORW no-code project actions

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: orw-project-action-${{ github.repository }}
  cancel-in-progress: false

env:
  ORW_CORE_REVISION: "__ORW_CORE_REVISION__"

jobs:
  project-action:
    name: Apply researcher action
    if: >-
      github.repository != 'dhuzard/OpenResearchWorkspace-template' &&
      (
        startsWith(github.event.issue.title, '[ORW Add Study]') ||
        startsWith(github.event.issue.title, '[ORW Add Assay]') ||
        startsWith(github.event.issue.title, '[ORW Register Data]') ||
        startsWith(github.event.issue.title, '[ORW Add Contributor]') ||
        startsWith(github.event.issue.title, '[ORW Check]')
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Check who submitted the action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          USER: ${{ github.event.issue.user.login }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$USER/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write)
              echo "Action submitted by authorized repository participant $USER ($permission)."
              ;;
            *)
              echo "::error::ORW project actions require repository write access."
              exit 1
              ;;
          esac

      - name: Check out project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned canonical ORW core
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/dhuzard/OpenResearchWorkspace.git@$ORW_CORE_REVISION"

      - name: Apply requested ORW action
        id: action
        continue-on-error: true
        env:
          ORW_RESPONSE_PATH: /tmp/orw-action-response.md
        run: python scripts/handle_project_action.py

      - name: Commit validated workspace change
        if: steps.action.outputs.changed == 'true' && steps.action.outputs.ok == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .research studies project-docs references
          if git diff --cached --quiet; then
            echo "::error::ORW reported a change but Git has no staged changes."
            exit 1
          fi
          git commit -m "Apply ORW no-code project action"
          git push

      - name: Reply with the result
        if: always() && hashFiles('/tmp/orw-action-response.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/orw-action-response.md

      - name: Close successful action
        if: steps.action.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

      - name: Mark unsuccessful action
        if: steps.action.outputs.ok != 'true'
        run: |
          echo "::error::ORW did not apply the requested action. See the issue comment."
          exit 1

  source-template-guard:
    name: Redirect actions submitted in the source template
    if: >-
      github.repository == 'dhuzard/OpenResearchWorkspace-template' &&
      (
        startsWith(github.event.issue.title, '[ORW Add Study]') ||
        startsWith(github.event.issue.title, '[ORW Add Assay]') ||
        startsWith(github.event.issue.title, '[ORW Register Data]') ||
        startsWith(github.event.issue.title, '[ORW Add Contributor]') ||
        startsWith(github.event.issue.title, '[ORW Check]')
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Explain where project actions belong
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/orw-template-guard.md <<'EOF'
          This is the **source template repository**.

          First choose **Use this template → Create a new repository**, initialize that research workspace, and then run ORW actions from the new repository.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/orw-template-guard.md
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason not_planned
