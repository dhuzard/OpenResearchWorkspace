name: Publish generated GitHub template

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the tested generated tree to OpenResearchWorkspace-template"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate, test, and optionally publish template
    runs-on: ubuntu-24.04

    steps:
      - name: Check out canonical repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install canonical ORW core
        run: python -m pip install .

      - name: Run template contract tests
        run: python -m unittest tests.test_github_template_distribution -v

      - name: Generate template from this exact canonical commit
        run: |
          python scripts/build_github_template.py \
            --output dist/github-template \
            --core-revision "$GITHUB_SHA" \
            --force

      - name: Share generated tree for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-github-template-${{ github.sha }}
          path: dist/github-template/
          if-no-files-found: error

      - name: Require cross-repository publish token
        if: ${{ inputs.publish }}
        env:
          TEMPLATE_SYNC_TOKEN: ${{ secrets.ORW_TEMPLATE_SYNC_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TEMPLATE_SYNC_TOKEN" ]; then
            echo "::error::Set ORW_TEMPLATE_SYNC_TOKEN to a fine-grained token with Contents: write on dhuzard/OpenResearchWorkspace-template."
            exit 1
          fi

      - name: Check out published template repository
        if: ${{ inputs.publish }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dhuzard/OpenResearchWorkspace-template
          token: ${{ secrets.ORW_TEMPLATE_SYNC_TOKEN }}
          path: published-template
          persist-credentials: true

      - name: Replace published tree with generated output
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          rsync -a --delete --exclude=.git/ dist/github-template/ published-template/
          cd published-template
          git diff --check

      - name: Commit and push generated template
        if: ${{ inputs.publish }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd published-template
          if [ -z "$(git status --porcelain)" ]; then
            echo "Published template already matches generated output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync generated ORW template from $SOURCE_SHA"
          git push
