name: Alpha release checks
on:
  pull_request:
  # The merged state is not what any pull request tested: main can carry a
  # combination of branches that only ever met here. Validate it on arrival
  # so a release never starts from an unverified commit.
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # A superseded branch or main run has nothing left to prove, so let the
  # newer one cancel it. A release rehearsal arrives through workflow_call,
  # where github.event_name is the caller's workflow_dispatch: it lands in
  # its own group and is never cancelled by ordinary development traffic.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install build and test dependencies
        run: python -m pip install . build twine
      - name: Regression and cross-language tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build --outdir dist/packages
      - name: Check package metadata and Markdown
        run: python -m twine check --strict dist/packages/*
        shell: bash
      - name: Test exact artifacts in separate clean environments
        run: python scripts/test_distributions.py dist/packages --version 0.1.0a1
      - name: Rebuild standalone browser from source
        run: python scripts/build_browser.py
      - name: Exercise the candidate-building path without upload credentials
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        run: |
          python scripts/release.py build --directory dist/release-candidate --version 0.1.0a1
          python scripts/release.py verify --directory dist/release-candidate --version 0.1.0a1
      - name: Share non-published review artifacts
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-review-artifacts
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 14
