name: Initialize research project

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: initialize-project-${{ github.repository }}
  cancel-in-progress: false

jobs:
  initialize:
    name: Create project structure and metadata
    if: >-
      startsWith(github.event.issue.title, '[ORW Setup]') &&
      github.repository != 'dhuzard/OpenResearchWorkspace'
    runs-on: ubuntu-latest

    steps:
      - name: Check who submitted the setup form
        shell: bash
        env:
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Setup submitted by an authorized repository participant ($ASSOCIATION)."
              ;;
            *)
              echo "::error::Project initialization must be submitted by the repository owner or an authorized collaborator."
              exit 1
              ;;
          esac

      - name: Check out project
        uses: actions/checkout@v4

      - name: Refuse accidental re-initialization
        shell: bash
        run: |
          if [ -f .research/initialized ]; then
            echo "::error::This project has already been initialized."
            exit 1
          fi

      - name: Read and validate setup form
        id: setup
        run: python scripts/parse_setup_issue.py

      - name: Create ISA-aligned project files
        env:
          PROJECT_TITLE: ${{ steps.setup.outputs.project_title }}
          PROJECT_DESCRIPTION: ${{ steps.setup.outputs.project_description }}
          STUDY_TITLE: ${{ steps.setup.outputs.study_title }}
          ASSAY_TITLE: ${{ steps.setup.outputs.assay_title }}
          DATA_LOCATION: ${{ steps.setup.outputs.data_location }}
          DATA_ACCESS: ${{ steps.setup.outputs.data_access }}
          KEYWORDS: ${{ steps.setup.outputs.keywords }}
          ORCID: ${{ steps.setup.outputs.orcid }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: python scripts/initialize_project.py

      - name: Commit initialized workspace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .research studies project-docs references
          if git diff --cached --quiet; then
            echo "::error::Initialization produced no changes."
            exit 1
          fi
          git commit -m "Initialize research workspace"
          git push

      - name: Confirm setup in the form thread
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "✅ **Your OpenResearchWorkspace project is initialized.**\n\nORW created your first ISA Study/Assay structure and updated the project metadata and README.\n\n➡️ **[Open your initialized workspace](https://github.com/$REPO)**\n\nThis setup form is now complete and will be closed automatically."
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

      - name: Workflow summary
        run: |
          echo "## Research workspace initialized" >> "$GITHUB_STEP_SUMMARY"
          echo "The setup form was validated and the ISA-aligned workspace was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain a failed setup
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "❌ **ORW could not finish initialization.**\n\nThe setup form has been left open so you can ask for help or correct the problem.\n\nTechnical details: $RUN_URL\n\nIf you are a beginner, you do not need to understand that log yourself—share the link when asking for help."
